<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192d58"><title>Monster Quest — Chore Adventures</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f8ff;background:#101a35}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#182b56,#101a35 55%,#243259);min-height:100vh}main{max-width:530px;margin:auto;padding:18px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;letter-spacing:2px;color:#a9d4ff;font-weight:800}h1{font-size:26px;margin:5px 0}h2{font-size:20px;margin:5px 0 13px}.muted{color:#c1cce5;font-size:13px}.panel{background:#ffffff12;border:1px solid #ffffff24;border-radius:22px;padding:17px;margin:14px 0;box-shadow:0 9px 20px #0001}.hero{background:linear-gradient(120deg,#4556a6,#2c8c91);padding:20px}.pill{background:#ffffff25;border-radius:50px;padding:8px 12px;font-weight:800;font-size:13px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.bar{height:12px;background:#0004;border-radius:30px;overflow:hidden}.bar>div{background:linear-gradient(90deg,#64e2b0,#f9d466);height:100%;transition:width .2s}.btn{border:0;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:800;background:#ffdc74;color:#293252;cursor:pointer}.btn.secondary{background:#ffffff20;color:white;border:1px solid #ffffff35}.btn.small{padding:8px 11px;font-size:12px}.btn:disabled{opacity:.4;cursor:default}.row{display:flex;align-items:center;gap:12px;justify-content:space-between}.mission{background:#ffffff12;border-radius:16px;padding:12px;margin:9px 0;display:flex;align-items:center;gap:12px}.emoji{font-size:30px}.grow{flex:1}.done{opacity:.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.creature{border-radius:19px;padding:14px;text-align:center;background:linear-gradient(145deg,#ffffff25,#ffffff0c);border:1px solid #ffffff2c}.art{font-size:64px;filter:drop-shadow(0 7px 4px #0003);margin:7px 0}.creature strong{display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:#101b39f5;border-top:1px solid #ffffff2b;display:flex;justify-content:center;padding:9px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:#c0cbe4;flex:1;max-width:110px;padding:7px 1px;font-size:11px;font-weight:700}.nav button.active{color:#ffdc74}.nav span{display:block;font-size:23px;margin-bottom:3px}input,select{background:#f4f6ff;color:#172449;border:0;border-radius:12px;padding:12px;font-size:16px;width:100%;margin:5px 0 10px}.hidden{display:none!important}.message{padding:12px;background:#ffe6a7;color:#2d3351;border-radius:14px;margin:10px 0;font-weight:700}.chip{display:inline-block;background:#ffffff20;padding:6px 9px;border-radius:10px;font-size:12px;margin:3px}.tiny{font-size:12px;color:#c1cce5}button:focus-visible,input:focus-visible{outline:3px solid #ffdc74}.scene{text-align:center;font-size:78px;padding:18px;background:linear-gradient(#4d9e98,#376274);border-radius:20px}.choice{display:flex;gap:8px;flex-wrap:wrap} .choice button{flex:1} .locked{filter:grayscale(1);opacity:.45}
</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav><script>
const KEY='monsterquest_v1';const today=()=>new Date().toLocaleDateString('en-CA');const defaults=()=>({name:'',coins:0,xp:0,orbs:1,creatures:['Spriglet'],selected:'Spriglet',wins:0,lastDay:today(),completed:[],chores:[{id:1,title:'Make my bed',icon:'🛏️',xp:20},{id:2,title:'Brush my teeth',icon:'🪥',xp:15},{id:3,title:'Put away toys',icon:'🧸',xp:20},{id:4,title:'Finish schoolwork',icon:'📚',xp:30}],pin:'',reward:'Choose a family activity',rewardCost:120,claimed:0});
let s;try{s={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){s=defaults()}let tab='home',notice='',parentOpen=false,parentUnlocked=false,challenge=0;const monsters=[{name:'Spriglet',icon:'🌱',type:'Leaf',power:3},{name:'Emberoo',icon:'🦊',type:'Flame',power:4},{name:'Bubblin',icon:'🐳',type:'Water',power:4},{name:'Voltkit',icon:'🐱',type:'Spark',power:5},{name:'Pebblix',icon:'🦔',type:'Stone',power:5},{name:'Moonwing',icon:'🦇',type:'Moon',power:6}];const enemies=[{name:'Mossmunch',icon:'🐛'},{name:'Cloudpuff',icon:'☁️'},{name:'Glimmerbug',icon:'🦋'}];
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function resetDay(){if(s.lastDay!==today()){s.completed=[];s.lastDay=today();save()}}function level(){return 1+Math.floor(s.xp/100)}function say(x){notice=x;render()}function button(text,fn,secondary=false){return `<button class="btn ${secondary?'secondary':''}" onclick="${fn}">${text}</button>`}function header(){return `<div class="top"><div><div class="eyebrow">MONSTER QUEST</div><h1>Hi, ${esc(s.name)}! ✨</h1></div><div class="pill">⭐ Lv ${level()}</div></div><div class="stats"><span class="pill">🪙 ${s.coins}</span><span class="pill">🔮 ${s.orbs} orbs</span><span class="pill">⚡ ${s.xp} XP</span></div>`}function nav(){document.getElementById('nav').innerHTML=s.name?['home','creatures','explore','rewards','parent'].map((t,i)=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><span>${['🏠','🐾','🗺️','🎁','🔒'][i]}</span>${['Missions','Creatures','Explore','Rewards','Parent'][i]}</button>`).join(''):''}function go(t){tab=t;notice='';render()}
function render(){resetDay();const a=document.getElementById('app');if(!s.name){a.innerHTML=`<div class="panel hero" style="margin-top:12vh;text-align:center"><div style="font-size:80px">🌱🦊🐳</div><div class="eyebrow">WELCOME, ADVENTURER!</div><h1>Monster Quest</h1><p>Complete real-life missions. Collect magical friends. Explore the world!</p><label for="heroName">Choose your hero name</label><input id="heroName" maxlength="20" placeholder="Your hero name" autocomplete="off"><button class="btn" onclick="start()">Start my adventure →</button></div>`;nav();return}let html=header();if(notice)html+=`<div class="message" role="status">${esc(notice)}</div>`;if(tab==='home'){let n=s.completed.length;html+=`<div class="panel hero"><h2>🌟 Today's Quest</h2><p>Complete missions to earn coins, XP, and capture orbs!</p><div class="row"><b>${n} of ${s.chores.length} missions</b><b>${s.chores.length?Math.round(n/s.chores.length*100):100}%</b></div><div class="bar"><div style="width:${s.chores.length?n/s.chores.length*100:100}%"></div></div></div><h2>📜 Daily missions</h2>`;html+=s.chores.map(c=>`<div class="mission ${s.completed.includes(c.id)?'done':''}"><div class="emoji">${esc(c.icon)}</div><div class="grow"><b>${esc(c.title)}</b><div class="tiny">+${c.xp} XP · +${Math.ceil(c.xp/2)} coins</div></div><button class="btn small" ${s.completed.includes(c.id)?'disabled':''} onclick="complete(${c.id})">${s.completed.includes(c.id)?'✓ Done':'Done!'}</button></div>`).join('');html+=`<div class="panel"><b>🐾 Your companion: ${esc(s.selected)}</b><p class="muted">Finish all missions for a bonus capture orb!</p></div>`}else if(tab==='creatures'){html+=`<div class="panel"><h2>🐾 Creature Collection</h2><p class="muted">You have ${s.creatures.length} of ${monsters.length} original creatures. Spend one orb to discover a new friend!</p><button class="btn" onclick="capture()" ${s.orbs<1||s.creatures.length===monsters.length?'disabled':''}>🔮 Discover creature (1 orb)</button></div><div class="grid">`+monsters.map(m=>{let owned=s.creatures.includes(m.name);return `<div class="creature ${owned?'':'locked'}"><div class="art">${owned?m.icon:'❔'}</div><strong>${owned?m.name:'Undiscovered'}</strong><div class="tiny">${owned?m.type+' · Power '+m.power:'Complete quests to find'}</div>${owned?`<button class="btn small ${s.selected===m.name?'secondary':''}" onclick="selectCreature('${m.name}')">${s.selected===m.name?'✓ Buddy':'Choose'}</button>`:''}</div>`}).join('')+`</div><div class="panel"><h2>✨ Creature Growth</h2><p>Your buddy grows stronger as you level up. Evolution stages unlock at levels 3 and 6!</p><b>Current stage: ${level()>=6?'🌟 Legendary form':level()>=3?'✨ Evolved form':'🌱 Young companion'}</b></div>`}else if(tab==='explore'){let enemy=enemies[challenge%enemies.length];html+=`<div class="panel"><h2>🗺️ Whisperwood Forest</h2><div class="scene">🌳 ${enemy.icon} 🌲</div><p>A wild ${enemy.name} wants a friendly challenge!</p><div class="row"><span>🐾 ${esc(s.selected)}</span><span>⚔️</span><span>${enemy.icon} ${enemy.name}</span></div><p class="muted">Answer a simple question to win. No fighting or scary content.</p>${button('Start challenge','battle()')}</div><div class="panel"><b>🏆 Challenges won: ${s.wins}</b><p class="tiny">Each win earns 5 XP. Missions are the main way to earn capture orbs.</p></div>`}else if(tab==='rewards'){html+=`<div class="panel"><h2>🎁 Treasure Shop</h2><div class="scene">🎁✨🏆</div><h2>${esc(s.reward)}</h2><p>Cost: 🪙 ${s.rewardCost} coins</p><p class="muted">Ask your parent to approve your reward!</p><button class="btn" onclick="claim()" ${s.coins<s.rewardCost?'disabled':''}>Request reward</button><p class="tiny">Rewards claimed: ${s.claimed}. Parent approval required.</p></div>`}else if(tab==='parent'){html+=`<div class="panel"><h2>🔒 Parent Zone</h2>${!s.pin?`<p>Create a 4–8 digit parent PIN. Don't share it with your child.</p><input id="pinNew" type="password" inputmode="numeric" maxlength="8" placeholder="New parent PIN"><button class="btn" onclick="setPin()">Create PIN</button>`:!parentUnlocked?`<p>Enter your parent PIN to manage missions and rewards.</p><input id="pinTry" type="password" inputmode="numeric" maxlength="8" placeholder="Parent PIN"><button class="btn" onclick="unlock()">Unlock</button>`:`<div class="row"><b>Manage missions</b>${button('Lock','lock()',true)}</div><p class="tiny">Completed missions can be changed for future days. Daily completion resets automatically.</p>${s.chores.map(c=>`<div class="mission"><span>${esc(c.icon)}</span><div class="grow">${esc(c.title)} · ${c.xp} XP</div><button class="btn small secondary" onclick="removeChore(${c.id})">Remove</button></div>`).join('')}<label>New chore</label><input id="choreName" maxlength="45" placeholder="e.g. Feed the dog"><label>XP reward</label><select id="choreXp"><option value="10">10 XP</option><option value="20" selected>20 XP</option><option value="30">30 XP</option><option value="40">40 XP</option></select><button class="btn" onclick="addChore()">Add mission</button><hr><label>Family reward</label><input id="rewardName" maxlength="60" value="${esc(s.reward)}"><label>Coin cost</label><input id="rewardCost" type="number" min="1" max="9999" value="${s.rewardCost}"><button class="btn" onclick="updateReward()">Save reward</button><hr><button class="btn secondary" onclick="resetProgress()">Reset game progress</button>`}</div>`}a.innerHTML=html;nav()}
function start(){let v=document.getElementById('heroName').value.trim();if(v.length<1)return alert('Choose a hero name first!');s.name=v.slice(0,20);save();render()}function complete(id){let c=s.chores.find(x=>x.id===id);if(!c||s.completed.includes(id))return;s.completed.push(id);s.xp+=c.xp;s.coins+=Math.ceil(c.xp/2);let bonus=s.chores.length>0&&s.completed.length===s.chores.length;if(bonus)s.orbs++;save();say(bonus?'🎉 All missions complete! You earned a bonus capture orb!':`Great job! +${c.xp} XP and +${Math.ceil(c.xp/2)} coins!`)}function capture(){if(s.orbs<1)return;let available=monsters.filter(m=>!s.creatures.includes(m.name));if(!available.length)return;let m=available[Math.floor(Math.random()*available.length)];s.orbs--;s.creatures.push(m.name);save();say(`✨ You discovered ${m.name}!`)}function selectCreature(n){if(!s.creatures.includes(n))return;s.selected=n;save();say(`${n} is your new buddy!`)}function battle(){let q=Math.floor(Math.random()*8)+2, r=Math.floor(Math.random()*7)+1;let answer=prompt(`Friendly challenge! What is ${q} + ${r}?`);if(answer===null)return;if(Number(answer)===q+r&&answer.trim()!==''){s.wins++;s.xp+=5;challenge++;save();say('🎉 Great answer! Your buddy won! +5 XP')}else say(`Good try! The answer is ${q+r}. Try another challenge!`)}function claim(){if(s.coins<s.rewardCost)return;parentOpen=true;let p=prompt('Parent approval: enter your PIN to redeem the reward');if(p===null)return;if(!s.pin){say('Ask a parent to create a PIN in the Parent tab first.');return}if(p!==s.pin){say('Parent approval not granted.');return}s.coins-=s.rewardCost;s.claimed++;save();say(`🎁 Reward approved: ${s.reward}!`)}function setPin(){let p=document.getElementById('pinNew').value;if(!/^\d{4,8}$/.test(p))return alert('Choose 4 to 8 digits');s.pin=p;parentUnlocked=true;save();say('Parent PIN created. You can now manage missions.')}function unlock(){if(document.getElementById('pinTry').value===s.pin){parentUnlocked=true;render()}else alert('Incorrect PIN')}function lock(){parentUnlocked=false;render()}function addChore(){if(!parentUnlocked)return;let v=document.getElementById('choreName').value.trim();if(!v)return alert('Enter a chore');s.chores.push({id:Date.now(),title:v.slice(0,45),icon:'⭐',xp:Number(document.getElementById('choreXp').value)});save();say('Mission added!')}function removeChore(id){if(!parentUnlocked)return;s.chores=s.chores.filter(x=>x.id!==id);s.completed=s.completed.filter(x=>x!==id);save();render()}function updateReward(){if(!parentUnlocked)return;let n=document.getElementById('rewardName').value.trim(),c=Number(document.getElementById('rewardCost').value);if(!n||!Number.isInteger(c)||c<1||c>9999)return alert('Enter a reward and a valid cost');s.reward=n;s.rewardCost=c;save();say('Reward updated!')}function resetProgress(){if(!parentUnlocked)return;if(!confirm('Reset coins, creatures, and XP? Chores and parent PIN will stay.'))return;s.coins=0;s.xp=0;s.orbs=1;s.creatures=['Spriglet'];s.selected='Spriglet';s.wins=0;s.claimed=0;s.completed=[];save();say('Adventure progress reset.')}render();
</script></body></html>
